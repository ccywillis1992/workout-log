<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>STRENGTH.LOG - Pristine Gym Tracker</title>
    <!-- Trailing slash redirect for PWA subfolder installations (e.g. GitHub Pages) -->
    <script>
      (function() {
        const path = window.location.pathname;
        if (!path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
    <!-- PWA Settings -->
    <link rel="manifest" href="./manifest.json?v=2" />
    <meta name="theme-color" content="#a3e635" />
    <link rel="icon" type="image/png" href="./icon.png?v=2" />
    
    <!-- iOS Web App Standalone Meta and Touch Icons -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="STRENGTH.LOG" />
    <link rel="apple-touch-icon" href="./icon.png?v=2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Register Standard Service Worker with Auto-Reload on Updates -->
    <script>
      (function() {
        const isDev = window.location.hostname.includes('ais-dev') || 
                      window.location.hostname.includes('localhost') || 
                      window.location.hostname.includes('127.0.0.1');

        if (isDev) {
          console.log('STRENGTH.LOG: Dev environment detected. Forcing Service Worker unregistration and custom cache purge to refresh preview...');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister().then(function(unregistered) {
                  if (unregistered) {
                    console.log('STRENGTH.LOG: Purged stale dev Service Worker successfully');
                  }
                });
              }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var i = 0; i < names.length; i++) {
                caches.delete(names[i]);
              }
            });
          }
          // Do not proceed to register SW in dev mode
          return;
        }

        // Force clean reload for v2.5 update in production/preview environments
        if (localStorage.getItem('strength_log_version_key_2_5') !== 'active_v2_5') {
          console.log('STRENGTH.LOG: Purging stale Service Workers and offline caches to fetch latest modifications...');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var i = 0; i < names.length; i++) {
                caches.delete(names[i]);
              }
            });
          }
          localStorage.setItem('strength_log_version_key_2_5', 'active_v2_5');
          setTimeout(function() {
            window.location.reload();
          }, 300);
        }

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./service-worker.js?v=4')
              .then((reg) => {
                console.log('STRENGTH.LOG: ServiceWorker registered successfully on scope:', reg.scope);
                
                // Eagerly check for service worker updates on page view
                reg.update();

                // Auto-reload the tab if a new service worker completes installation
                reg.onupdatefound = () => {
                  const installingWorker = reg.installing;
                  if (installingWorker) {
                    installingWorker.onstatechange = () => {
                      if (installingWorker.state === 'installed') {
                        if (navigator.serviceWorker.controller) {
                          console.log('STRENGTH.LOG: New code compiled. Reloading page...');
                          window.location.reload();
                        }
                      }
                    };
                  }
                };
              })
              .catch((err) => {
                console.warn('STRENGTH.LOG: ServiceWorker registration failed: ', err);
              });
          });
        }
      })();
    </script>
  </body>
</html>
