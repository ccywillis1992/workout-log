<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STRENGTH.LOG - Pristine Gym Tracker</title>
    <!-- PWA Settings -->
    <link rel="manifest" href="./manifest.json?v=2" />
    <meta name="theme-color" content="#a3e635" />
    <link rel="icon" type="image/png" href="./icon.png?v=2" />
    
    <!-- iOS Web App Standalone Meta and Touch Icons -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="STRENGTH.LOG" />
    <link rel="apple-touch-icon" href="./icon.png?v=2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Register Standard Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js?v=2')
            .then((reg) => {
              console.log('STRENGTH.LOG: ServiceWorker registered successfully on scope:', reg.scope);
            })
            .catch((err) => {
              console.warn('STRENGTH.LOG: ServiceWorker registration failed: ', err);
            });
        });
      }
    </script>
  </body>
</html>
